<h2><%:Instance Running Status%></h2>
<p></p>

<div id="natmap-status-content">
	<em><%:Getting...%></em>
</div>

<script type="text/javascript">
	XHR.poll(5, '<%=luci.dispatcher.build_url("admin", "services", "natmap_render_status")%>', null,
		function(x, data) {
			var status_content_div = document.getElementById('natmap-status-content');
			if (x && x.status == 200 && x.responseText) {
				status_content_div.innerHTML = x.responseText;
			}
		}
	);
</script>
